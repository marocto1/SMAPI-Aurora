name: Aurora patch validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Aurora
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python compile and mock regression tests
        run: |
          python -m py_compile apply_aurora.py compat/compat_core.py tests/test_patch.py
          python tests/test_patch.py
      - name: Checkout upstream at tested commit
        run: |
          git clone --filter=blob:none https://github.com/NRTnarathip/SMAPILoader.git /tmp/SMAPILoader
          git -C /tmp/SMAPILoader checkout 092c6864838dd2118d216cb3e03f3c731ad17c08
      - name: Validate patch against real upstream source
        run: |
          python apply_aurora.py /tmp/SMAPILoader --dry-run
          python apply_aurora.py /tmp/SMAPILoader
          test -f /tmp/SMAPILoader/SMAPIGameLoader/Launcher/Pages/SettingsPage.cs
          grep -q '0.5.0' /tmp/SMAPILoader/SMAPIGameLoader/SMAPIGameLoader.csproj
          grep -q 'CheckAsync' /tmp/SMAPILoader/SMAPIGameLoader/Launcher/GameCardInfo.cs
          git -C /tmp/SMAPILoader diff --stat
          test -f /tmp/SMAPILoader/SMAPIGameLoader/Launcher/AuroraModHealth.cs
          test -f /tmp/SMAPILoader/SMAPIGameLoader/Launcher/AuroraModArchive.cs
          grep -q 'AuroraModArchive.ExtractChecked' /tmp/SMAPILoader/SMAPIGameLoader/Launcher/ModInstaller.cs

          test -f /tmp/SMAPILoader/SMAPIGameLoader/Launcher/AuroraGameDiagnostics.cs
          grep -q 'AssemblyApkPaths' /tmp/SMAPILoader/SMAPIGameLoader/Game/GameAssemblyManager.cs
          grep -q 'View game compatibility report' /tmp/SMAPILoader/SMAPIGameLoader/Launcher/Pages/HomePage.cs
