name: Aurora v0.8 Android version manager full SMAPI QA APK

on:
  push:
    paths:
      - 'junimogate-bridge/version-manager/**'
      - '.github/workflows/aurora-version-manager-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-full-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK toolchain
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          for x in aapt apksigner zipalign d8; do test -x "$BUILD_TOOLS/$x"; done
          test -s "$ANDROID_HOME/platforms/android-35/android.jar"
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/aurora-v08/dist" "$RUNNER_TEMP/aurora-v08/classes" "$RUNNER_TEMP/aurora-v08/new-dex"

      - name: Pin official released Aurora full SMAPI APK and Apache-licensed resource compiler
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --silent --show-error \
            -o "$RUNNER_TEMP/aurora-v08/original.apk" \
            https://github.com/marocto1/SMAPI-Aurora/releases/download/v0.7.0-runtime-qa/SMAPI-Aurora-v0.7.0-Runtime-QA-arm64.apk
          echo "869367b6918d51063ce4e7e5c279d972aa04f05976cfb142cd81604c92c94cc3  $RUNNER_TEMP/aurora-v08/original.apk" | sha256sum -c
          curl -fL --retry 3 --silent --show-error \
            -o "$RUNNER_TEMP/aurora-v08/apktool.jar" \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  $RUNNER_TEMP/aurora-v08/apktool.jar" | sha256sum -c
          "$BUILD_TOOLS/aapt" dump badging "$RUNNER_TEMP/aurora-v08/original.apk" \
            | grep -Fq "package: name='org.junimogate.app'"

      - name: Compile Java version manager to Android DEX without touching SMAPI runtime
        shell: bash
        run: |
          set -euo pipefail
          javac --release 8 -encoding UTF-8 \
            -cp "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d "$RUNNER_TEMP/aurora-v08/classes" \
            junimogate-bridge/version-manager/AuroraVersionActivity.java
          "$BUILD_TOOLS/d8" --min-api 26 --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
            --output "$RUNNER_TEMP/aurora-v08/new-dex" \
            "$RUNNER_TEMP/aurora-v08/classes/org/junimogate/aurora/AuroraVersionActivity.class"
          test -s "$RUNNER_TEMP/aurora-v08/new-dex/classes.dex"

      - name: Decode existing Aurora app, add manager and retain all original assemblies
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx3072m -jar "$RUNNER_TEMP/aurora-v08/apktool.jar" d \
            -s -f "$RUNNER_TEMP/aurora-v08/original.apk" -o "$RUNNER_TEMP/aurora-v08/decoded"
          test -s "$RUNNER_TEMP/aurora-v08/decoded/classes.dex"
          test -s "$RUNNER_TEMP/aurora-v08/decoded/classes2.dex"
          test ! -f "$RUNNER_TEMP/aurora-v08/decoded/classes3.dex"
          cp "$RUNNER_TEMP/aurora-v08/new-dex/classes.dex" \
            "$RUNNER_TEMP/aurora-v08/decoded/classes3.dex"
          python3 junimogate-bridge/version-manager/patch_manifest.py \
            "$RUNNER_TEMP/aurora-v08/decoded"

      - name: Repack and QA-sign combined Aurora version manager + full SMAPI APK
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx3072m -jar "$RUNNER_TEMP/aurora-v08/apktool.jar" b \
            "$RUNNER_TEMP/aurora-v08/decoded" \
            -o "$RUNNER_TEMP/aurora-v08/unsigned.apk"
          "$BUILD_TOOLS/zipalign" -p -f 4 \
            "$RUNNER_TEMP/aurora-v08/unsigned.apk" "$RUNNER_TEMP/aurora-v08/aligned.apk"
          "$BUILD_TOOLS/zipalign" -c 4 "$RUNNER_TEMP/aurora-v08/aligned.apk"
          export SIGN_PASS="$(openssl rand -hex 18)"
          keytool -genkeypair -noprompt \
            -alias aurora-qa -keyalg RSA -keysize 3072 -validity 3650 \
            -dname "CN=SMAPI Aurora v0.8 QA,O=Marocto" \
            -storetype PKCS12 -keystore "$RUNNER_TEMP/aurora-v08/build-keystore.p12" \
            -storepass "$SIGN_PASS" -keypass "$SIGN_PASS" >/dev/null
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/aurora-v08/build-keystore.p12" \
            --ks-type PKCS12 --ks-key-alias aurora-qa \
            --ks-pass env:SIGN_PASS --key-pass env:SIGN_PASS \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out "$RUNNER_TEMP/aurora-v08/dist/SMAPI-Aurora-v0.8.0-Version-Manager-SMAPI-QA-arm64.apk" \
            "$RUNNER_TEMP/aurora-v08/aligned.apk"
          unset SIGN_PASS
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs \
            "$RUNNER_TEMP/aurora-v08/dist/SMAPI-Aurora-v0.8.0-Version-Manager-SMAPI-QA-arm64.apk"

      - name: Verify launcher, installer permissions, three DEXes, commercial exclusion and original 358 runtime files
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/aurora-v08/dist/SMAPI-Aurora-v0.8.0-Version-Manager-SMAPI-QA-arm64.apk"
          "$BUILD_TOOLS/aapt" dump badging "$APK" \
            | tee "$RUNNER_TEMP/aurora-v08/badging.txt"
          grep -Fq "package: name='org.junimogate.app'" "$RUNNER_TEMP/aurora-v08/badging.txt"
          grep -Fq "versionCode='12'" "$RUNNER_TEMP/aurora-v08/badging.txt"
          grep -Fq "versionName='0.8.0-aurora-version-qa'" "$RUNNER_TEMP/aurora-v08/badging.txt"
          grep -Fq "launchable-activity: name='org.junimogate.aurora.AuroraVersionActivity'" "$RUNNER_TEMP/aurora-v08/badging.txt"
          "$BUILD_TOOLS/aapt" dump permissions "$APK" \
            | grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES'
          unzip -Z1 "$APK" > "$RUNNER_TEMP/aurora-v08/names.txt"
          grep -Fxq 'classes.dex' "$RUNNER_TEMP/aurora-v08/names.txt"
          grep -Fxq 'classes2.dex' "$RUNNER_TEMP/aurora-v08/names.txt"
          grep -Fxq 'classes3.dex' "$RUNNER_TEMP/aurora-v08/names.txt"
          python3 junimogate-bridge/audit_runtime_apk.py \
            "$RUNNER_TEMP/aurora-v08/original.apk" "$APK"
          (cd "$RUNNER_TEMP/aurora-v08/dist" && sha256sum *.apk > SHA256SUMS.txt)
          echo "Signed Android APK with Aurora Java version manager + original full managed SMAPI runtime built and archive-audited." >> "$GITHUB_STEP_SUMMARY"
          echo "Installation and startup on Android hardware NOT tested; game prep failure remains unresolved." >> "$GITHUB_STEP_SUMMARY"

      - name: Include installation and limitation instructions
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/aurora-v08/dist/READ-ME-FIRST.txt" <<'EOF'
          SMAPI Aurora v0.8 Android Version Manager QA

          Launch screen: Version manager (Java)
          SMAPI runtime: EXACT original JunimoGate/GameHost managed and native
          binaries from the v0.7.0 full-runtime QA base APK.

          - Select version 1.6.15.3 build245 and enter YOUR OWN PRIVATE Google
            Drive file link; it is stored in the Android app private preferences.
          - Download the APKS archive through your browser / Google Drive.
          - Select the .apks archive; SHA256 for all three split APKs is checked
            against the previously inspected legal game package. Android asks
            for installation permission and approval.
          - Tap Launch SMAPI Aurora to open the unmodified GameHost.

          Do not expect built-in direct downloading from Drive; login and
          virus-scan confirmation require the browser.
          SMAPI GameHost signature verification is NOT bypassed. This QA APK is
          not on-device tested and might still give game_preparation_failed.
          Signing key differs from earlier builds. Back up your previous
          JunimoGate/Aurora private app data before any uninstall.
          No commercial game APKs/DLLs are in this distribution.
          Corresponding source: https://github.com/marocto1/SMAPI-Aurora
          Upstream: https://github.com/leontismaro/JunimoGate
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: SMAPI-Aurora-v0.8.0-Version-Manager-Full-SMAPI-UNTESTED
          path: ${{ runner.temp }}/aurora-v08/dist/
          if-no-files-found: error
          retention-days: 14
