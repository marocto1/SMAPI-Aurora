name: Publish Aurora v0.8 SMAPI version manager QA prerelease
on:
  push:
    paths:
      - '.github/workflows/aurora-v08-qa-release.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve known-passing v0.8 full-SMAPI APK and validate exact digest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/published"
          gh run download 39189042374 \
            --repo "${{ github.repository }}" \
            --name SMAPI-Aurora-v0.8.0-Version-Manager-Full-SMAPI-UNTESTED \
            --dir "$RUNNER_TEMP/published"
          APK="$RUNNER_TEMP/published/SMAPI-Aurora-v0.8.0-Version-Manager-SMAPI-QA-arm64.apk"
          test -s "$APK"
          echo "14ee61ecce19d3f8efdd891b9342ab8814e893136ace51d2aac3add1caef33e5  $APK" \
            | sha256sum --check
          python3 - "$APK" <<'PY'
          import zipfile,sys
          apk=sys.argv[1]
          with zipfile.ZipFile(apk) as archive:
              names=set(archive.namelist())
              assert archive.testzip() is None
              assert "classes3.dex" in names
              assert "assets/smapi-managed/StardewModdingAPI.dll" in names
              assert "assets/licenses/JunimoGate-GPL-3.0-only.txt" in names
              assert not any(n.lower().endswith("/stardewvalley.dll") for n in names)
          print("PASS: bundled original SMAPI and newly compiled Android version manager")
          PY
      - name: Publish as QA prerelease, not stable game compatibility guarantee
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.8.0-version-manager-qa \
            "$RUNNER_TEMP/published/SMAPI-Aurora-v0.8.0-Version-Manager-SMAPI-QA-arm64.apk" \
            "$RUNNER_TEMP/published/SHA256SUMS.txt" \
            --repo "${{ github.repository }}" \
            --target "$GITHUB_SHA" \
            --title "SMAPI Aurora v0.8.0 — Version Manager + Full SMAPI (UNTESTED)" \
            --notes-file junimogate-bridge/VERSION_MANAGER_RELEASE_NOTES.md \
            --prerelease
