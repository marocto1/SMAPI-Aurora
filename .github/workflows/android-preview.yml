name: Build Aurora Android preview APK
on:
  push:
    paths:
      - 'android-preview/**'
      - '.github/workflows/android-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK is not installed on this runner}"
          test -d "$ANDROID_HOME/platforms"
          echo "SDK=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile real Android APK
        run: gradle --no-daemon -p android-preview :app:assembleDebug
      - name: Verify APK output and size
        run: |
          test -s android-preview/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android-preview/app/build/outputs/apk/debug/app-debug.apk | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: SMAPI-Aurora-Preview-v0.5.1-APK
          path: android-preview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
