name: Build Aurora Android preview APK
on:
  push:
    paths:
      - 'android-preview/**'
      - '.github/workflows/android-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK is not installed on this runner}"
          test -d "$ANDROID_HOME/platforms"
          echo "SDK=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile real Android APK
        run: gradle --no-daemon -p android-preview :app:assembleDebug
      - name: Verify APK output and size
        run: |
          test -s android-preview/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android-preview/app/build/outputs/apk/debug/app-debug.apk | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: SMAPI-Aurora-Preview-v0.5.1-APK
          path: android-preview/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Aurora Preview prerelease
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp android-preview/app/build/outputs/apk/debug/app-debug.apk SMAPI-Aurora-v0.5.1-Preview.apk
          cat > "$RUNNER_TEMP/aurora-release-notes.md" <<'EOF'
          Native Android preview of the SMAPI Aurora interface.

          Includes installed-game selection, structural APK diagnostics, mod ZIP import into a folder explicitly chosen with Android Files, mod manifest browsing, and the ability to launch a normal installed game.

          **Important:** This preview does NOT load SMAPI mods into Stardew Valley. The original .NET SMAPI-based Aurora launcher is still blocked by missing game-derived compilation references and has not been device-tested.

          Debug-signed experimental APK. Back up your data, and use a test Mods folder.
          EOF
          if gh release view v0.5.1-preview >/dev/null 2>&1; then
            gh release upload v0.5.1-preview SMAPI-Aurora-v0.5.1-Preview.apk --clobber
          else
            gh release create v0.5.1-preview SMAPI-Aurora-v0.5.1-Preview.apk --prerelease \
              --title "SMAPI Aurora v0.5.1 — Android Preview" \
              --notes-file "$RUNNER_TEMP/aurora-release-notes.md"
          fi
