name: Publish Aurora source files
on:
  push:
    paths:
      - '.github/workflows/publish-source.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and unpack source bundle
        shell: bash
        run: |
          set -euo pipefail
          for i in 01 02 03 04; do
            test -f "payload/part${i}.b64"
          done
          cat payload/part{01,02,03,04}.b64 | base64 -d > aurora-core.tar.xz
          echo "90b5179a6ad5d19a4d0f69eda64b19a3fd5f28f558fcd94eb70974dd27ffc5a8  aurora-core.tar.xz" | sha256sum -c
          mkdir -p /tmp/aurora-source
          tar -xJf aurora-core.tar.xz -C /tmp/aurora-source
          cp -a /tmp/aurora-source/. .
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/NRTnarathip/SMAPILoader/master/LICENSE > LICENSE
          printf '%s\n' 'Prototype v0.2. Android UI + compatible installed APK detection. Not compiled or device-tested.' > CHANGES.md
          printf '%s\n' 'bin/' 'obj/' '.idea/' '.DS_Store' 'aurora_backups/' '*.apk' '*.keystore' > .gitignore
          rm -f aurora-core.tar.xz
      - name: Commit expanded public sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md LICENSE CHANGES.md .gitignore apply_aurora.py compat overrides tests
          git rm -f payload/part{01,02,03,04}.b64
          git diff --staged --quiet || git commit -m "Publish Aurora Android source patch v0.2"
          git push
