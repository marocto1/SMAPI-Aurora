name: Aurora SMAPI mod runtime smoke and real host suites
on:
  push:
    paths:
      - 'junimogate-bridge/smoke-mod/**'
      - '.github/workflows/aurora-smapi-mod-smoke-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Clone immutable SMAPI/JunimoGate host test sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/leontismaro/JunimoGate.git "$RUNNER_TEMP/JunimoGate"
          git -C "$RUNNER_TEMP/JunimoGate" checkout 029eafed917ae853d6c0a59330ee273524168296
          git -C "$RUNNER_TEMP/JunimoGate" submodule update --init smapi
          test -s "$RUNNER_TEMP/JunimoGate/smapi/src/SMAPI/Mobile/AndroidLoadingLogBuffer.cs"
          test -s "$RUNNER_TEMP/JunimoGate/tests/JunimoGate.Mods.Tests/Program.cs"
          test -s "$RUNNER_TEMP/JunimoGate/tests/JunimoGate.Rewriter.Tests/Program.cs"
          mkdir -p "$RUNNER_TEMP/JunimoGate/artifacts/nuget"

      - name: Actually execute the source host test harnesses (not dotnet test no-op)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/JunimoGate"
          total=0
          for name in Core Extraction Rewriter Mods; do
            project="tests/JunimoGate.${name}.Tests/JunimoGate.${name}.Tests.csproj"
            printf '\n== EXECUTING %s ==\n' "$project"
            dotnet run --project "$project" --configuration Release --nologo | tee "$RUNNER_TEMP/aurora-${name}.log"
            summary="$(grep -E '^[1-9][0-9]*/[1-9][0-9]* passed$' "$RUNNER_TEMP/aurora-${name}.log" | tail -1)"
            test -n "$summary"
            expected="${summary#*/}"
            passed="${summary%%/*}"
            test "$passed" = "${expected% passed}"
            total=$((total + passed))
            printf 'PASSED %s: %s\n' "$name" "$summary" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "All four genuine console-host test executables PASSED, count=$total." >> "$GITHUB_STEP_SUMMARY"
          echo "These are host simulations, not Android gameplay evidence." >> "$GITHUB_STEP_SUMMARY"

      - name: Extract public SMAPI API assembly from checksum-verified Aurora APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aurora-smoke"/{refs,dist,package}
          curl -fL --retry 3 --silent --show-error \
            https://github.com/marocto1/SMAPI-Aurora/releases/download/v0.8.8-native-home-qa/SMAPI-Aurora-v0.8.8-Native-Home-arm64-QA.apk \
            -o "$RUNNER_TEMP/aurora-smoke/baseline.apk"
          echo "8e2c95a221fb1edb3a268ae73dfccffa8ed4c83d508bf8bf7a1ff4247b9f6e4f  $RUNNER_TEMP/aurora-smoke/baseline.apk" | sha256sum -c
          python3 - "$RUNNER_TEMP/aurora-smoke/baseline.apk" "$RUNNER_TEMP/aurora-smoke/refs/StardewModdingAPI.dll" <<'PY'
          import sys,zipfile,pathlib
          source,output=map(pathlib.Path,sys.argv[1:])
          with zipfile.ZipFile(source) as z:
              assert z.testzip() is None
              member="assets/smapi-managed/StardewModdingAPI.dll"
              payload=z.read(member)
              assert len(payload)>100_000 and payload[:2]==b"MZ", "Bundled SMAPI DLL is not a PE assembly"
              output.write_bytes(payload)
          print("PASS: used SMAPI API from exact shipped Aurora v0.8.8, not desktop game DLLs")
          PY

      - name: Compile no-save-changes SMAPI smoke mod against shipped Android API
        shell: bash
        run: |
          set -euo pipefail
          dotnet build junimogate-bridge/smoke-mod/Aurora.SmapiSmoke.csproj \
            -c Release --nologo -v minimal \
            -p:AuroraSmapiApiDll="$RUNNER_TEMP/aurora-smoke/refs/StardewModdingAPI.dll"
          test -s junimogate-bridge/smoke-mod/bin/Release/net9.0/Aurora.SmapiSmoke.dll

      - name: Package strictly a mod ZIP; verify DLL and SMAPI metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,zipfile,struct,os
          root=pathlib.Path("junimogate-bridge/smoke-mod")
          dist=pathlib.Path(os.environ["RUNNER_TEMP"])/"aurora-smoke"/"dist"
          binary=root/"bin/Release/net9.0/Aurora.SmapiSmoke.dll"
          manifest=json.loads((root/"manifest.json").read_text())
          assert manifest["UniqueID"]=="Marocto.Aurora.SmapiSmoke"
          assert manifest["EntryDll"]==binary.name
          assert manifest["MinimumApiVersion"]=="4.5.2"
          payload=binary.read_bytes()
          assert payload[:2]==b"MZ"
          # .NET stores C# string literals in its #US heap as UTF-16LE.
          # Both forms are accepted for future compiler metadata changes.
          def has_marker(m):
              return m.encode("utf-16le") in payload or m.encode("ascii") in payload
          assert has_marker("AURORA_SMOKE_ENTRY"), "Compiled mod entry marker missing"
          assert has_marker("AURORA_SMOKE_GAME_LAUNCHED"), "Game launch event marker missing"
          assert has_marker("AURORA_SMOKE_SAVE_LOADED"), "Save-loaded marker missing"
          output=dist/"Aurora-SMAPI-Smoke-Mod-v1.0.0.zip"
          with zipfile.ZipFile(output,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              z.write(root/"manifest.json","Aurora SMAPI Smoke/manifest.json")
              z.write(binary,"Aurora SMAPI Smoke/Aurora.SmapiSmoke.dll")
          with zipfile.ZipFile(output) as z:
              assert z.testzip() is None
              assert len(z.namelist())==2
          print("PASS: test mod ZIP includes only source-controlled manifest and compiled diagnostic mod")
          print("NO COMMERCIAL GAME CONTENT: safe to share; does not alter saves")
          PY
          cat > "$RUNNER_TEMP/aurora-smoke/dist/READ-ME-FIRST.txt" <<'EOF'
          AURORA SMAPI / MODS ON-DEVICE SMOKE TEST (not a Stardew Valley APK)

          1. Keep your installed purchased Stardew Valley and your Aurora v0.8.8.
          2. In the original SMAPI Aurora interface import the ZIP to Mods.
          3. Add/enable "Aurora SMAPI Launch Smoke Test" in the active mod group.
          4. Launch the game with the original circular SMAPI button.
          5. In SMAPI logs look for:
             AURORA_SMOKE_ENTRY: independent SMAPI DLL loaded successfully.
             AURORA_SMOKE_GAME_LAUNCHED: the SMAPI game event fired.
          6. Open a test save: AURORA_SMOKE_SAVE_LOADED may then appear.
          7. Export BOTH launcher-current.txt and SMAPI-latest.txt if possible.
          It does not modify game data, settings, or saves.
          It is not a guarantee the native SMAPI GameHost launches on Android 16.
          If the app exits before the first marker, export the launcher log.
          EOF
          (cd "$RUNNER_TEMP/aurora-smoke/dist" && sha256sum Aurora-SMAPI-Smoke-Mod-v1.0.0.zip > SHA256SUMS.txt)

      - name: Publish diagnostic mod ZIP only (not a new Android APK)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=v0.8.8-smapi-smoke-qa
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Existing diagnostic ZIP release retained; no signature or file replacement."
          else
            gh release create "$tag" \
              "$RUNNER_TEMP/aurora-smoke/dist/Aurora-SMAPI-Smoke-Mod-v1.0.0.zip" \
              "$RUNNER_TEMP/aurora-smoke/dist/READ-ME-FIRST.txt" \
              "$RUNNER_TEMP/aurora-smoke/dist/SHA256SUMS.txt" \
              --prerelease --title "Aurora SMAPI Mod Smoke Test — diagnostic only" \
              --notes "Noninvasive SMAPI test mod compiled against the exact public SMAPI DLL bundled in Aurora v0.8.8. Import ZIP through the existing Mods interface. Its AURORA_SMOKE log markers verify mod entry, game launch event and save-loaded event on your phone. Does not change saves and contains no commercial game files. CI executes the upstream Core, Extraction, Rewriter and Mods executable suites; host test success does not establish Android gameplay."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-SMAPI-Smoke-Test
          path: ${{ runner.temp }}/aurora-smoke/dist/
          retention-days: 30
          if-no-files-found: error
