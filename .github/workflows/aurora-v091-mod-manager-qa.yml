name: Aurora v0.9.1 Mod Manager QA
on:
  push:
    paths:
      - 'junimogate-bridge/mod-manager/**'
      - '.github/workflows/aurora-v091-mod-manager-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test native shortcut injection
        run: |
          set -euo pipefail
          python3 -m unittest discover -s junimogate-bridge/mod-manager -p 'test_*.py' -v
          SOURCE=junimogate-bridge/mod-manager/AuroraModOverviewActivity.java
          if grep -E 'FileOutputStream|FileWriter|RandomAccessFile|[.]delete[(]|[.]renameTo[(]|[.]mkdir[(]|ProcessBuilder' "$SOURCE"; then
            echo "Mod overview must remain read-only" >&2; exit 1
          fi
      - name: Acquire pinned baseline and Android build tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aurora-v091"/{classes,newdex,dist}
          B="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "BUILD_TOOLS=$B" >> "$GITHUB_ENV"
          test -s "$ANDROID_HOME/platforms/android-35/android.jar"
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/aurora-v091/base.apk" https://github.com/marocto1/SMAPI-Aurora/releases/download/v0.8.9-boot-recovery-qa/SMAPI-Aurora-v0.8.9-Boot-Recovery-arm64-QA.apk
          echo "8b1a87249b7169b7f5dc40d8dcec9e9efc0f4eb84178ecb6ce9c3c5c638f0b60  $RUNNER_TEMP/aurora-v091/base.apk" | sha256sum -c
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/aurora-v091/apktool.jar" https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  $RUNNER_TEMP/aurora-v091/apktool.jar" | sha256sum -c
      - name: Compile read-only dashboard alongside unchanged version manager
        run: |
          set -euo pipefail
          javac --release 8 -encoding UTF-8 -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d "$RUNNER_TEMP/aurora-v091/classes" junimogate-bridge/version-manager/AuroraVersionActivity.java junimogate-bridge/mod-manager/AuroraModOverviewActivity.java
          find "$RUNNER_TEMP/aurora-v091/classes" -name '*.class' -print0 | xargs -0 "$BUILD_TOOLS/d8" --min-api 26 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output "$RUNNER_TEMP/aurora-v091/newdex"
          test -s "$RUNNER_TEMP/aurora-v091/newdex/classes.dex"
      - name: Inject shortcut into untouched v0.8.9
        run: |
          set -euo pipefail
          java -Xmx3072m -jar "$RUNNER_TEMP/aurora-v091/apktool.jar" d -s -f "$RUNNER_TEMP/aurora-v091/base.apk" -o "$RUNNER_TEMP/aurora-v091/decoded"
          test -s "$RUNNER_TEMP/aurora-v091/decoded/classes3.dex"
          cp "$RUNNER_TEMP/aurora-v091/newdex/classes.dex" "$RUNNER_TEMP/aurora-v091/decoded/classes3.dex"
          python3 junimogate-bridge/mod-manager/inject_mod_manager.py "$RUNNER_TEMP/aurora-v091/decoded"
      - name: Repackage and sign ARM64 QA
        run: |
          set -euo pipefail
          java -Xmx3072m -jar "$RUNNER_TEMP/aurora-v091/apktool.jar" b "$RUNNER_TEMP/aurora-v091/decoded" -o "$RUNNER_TEMP/aurora-v091/unsigned.apk"
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 "$RUNNER_TEMP/aurora-v091/unsigned.apk" "$RUNNER_TEMP/aurora-v091/aligned.apk"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$RUNNER_TEMP/aurora-v091/aligned.apk"
          export QA_PASS="$(openssl rand -hex 18)"
          keytool -genkeypair -noprompt -alias aurora-qa -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=Aurora Mod Manager v0.9.1 QA,O=Marocto" -storetype PKCS12 -keystore "$RUNNER_TEMP/aurora-v091/key.p12" -storepass "$QA_PASS" -keypass "$QA_PASS" >/dev/null
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/aurora-v091/key.p12" --ks-type PKCS12 --ks-key-alias aurora-qa --ks-pass env:QA_PASS --key-pass env:QA_PASS --v2-signing-enabled true --v3-signing-enabled true --out "$RUNNER_TEMP/aurora-v091/dist/SMAPI-Aurora-v0.9.1-Mod-Manager-arm64-QA.apk" "$RUNNER_TEMP/aurora-v091/aligned.apk"
          unset QA_PASS
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/aurora-v091/dist/SMAPI-Aurora-v0.9.1-Mod-Manager-arm64-QA.apk"
      - name: Audit binary compatibility with phone-tested build
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/aurora-v091/dist/SMAPI-Aurora-v0.9.1-Mod-Manager-arm64-QA.apk"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/aurora-v091/badging.txt"
          grep -Fq "package: name='org.junimogate.app' versionCode='21' versionName='0.9.1-mod-manager-qa'" "$RUNNER_TEMP/aurora-v091/badging.txt"
          grep -Fq "launchable-activity: name='org.junimogate.app.MainActivity'" "$RUNNER_TEMP/aurora-v091/badging.txt"
          "$BUILD_TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml | grep -Fq 'AuroraModOverviewActivity'
          python3 - "$RUNNER_TEMP/aurora-v091/base.apk" "$APK" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as a,zipfile.ZipFile(sys.argv[2]) as b:
              assert a.testzip() is b.testzip() is None
              old,new=set(a.namelist()),set(b.namelist())
              assert old<=new,old-new
              for name in old:
                  if name.startswith("META-INF/"):continue
                  if a.read(name)!=b.read(name):
                      assert name in {"classes3.dex","AndroidManifest.xml","resources.arsc"},name
              assert all(n.startswith("res/") or n.startswith("META-INF/") for n in new-old)
              for name in old:
                  if name.startswith("lib/") or name.startswith("assets/smapi-managed/"):
                      assert a.read(name)==b.read(name),name
              assert not any(n.lower().endswith("/stardewvalley.dll") for n in new)
              print("PASS: all managed original Mods, GameHost and SMAPI assets byte-identical")
          PY
          (cd "$RUNNER_TEMP/aurora-v091/dist" && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish QA APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/aurora-v091/dist/READ-ME-FIRST.txt" <<'EOF'
          Aurora v0.9.1 Mod Manager QA — Android ARM64.
          Standard Aurora Mods/Groups already supports ZIP import, groups,
          enable/disable, dependency fixing, config editing and deletion.
          NEW: LONG PRESS the Aurora app icon on your home screen, tap
          "Моды Aurora" to see a read-only list of installed/active mods
          and missing required dependencies. Use "Открыть Aurora" then
          Mods to edit or install, through the original safe manager.
          No automated mod downloads or updates.
          Not tested physically on phone yet. Same game/SMAPI and .NET
          binaries as verified v0.8.9, but Android shortcut is new.
          QA signing key differs: do not uninstall prior Aurora before
          backing up private mods/settings/saves; don't uninstall the game.
          EOF
          TAG=v0.9.1-mod-manager-qa
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing signed QA artifact retained"
          else
            gh release create "$TAG" "$RUNNER_TEMP/aurora-v091/dist/SMAPI-Aurora-v0.9.1-Mod-Manager-arm64-QA.apk" "$RUNNER_TEMP/aurora-v091/dist/READ-ME-FIRST.txt" "$RUNNER_TEMP/aurora-v091/dist/SHA256SUMS.txt" --prerelease --title "SMAPI Aurora v0.9.1 — Mod Manager QA" --notes "Experimental: original game/SMAPI and transactional Mods/Groups manager unchanged byte-for-byte; new read-only installed/active/mod-dependency overview via LONG PRESS Aurora app icon > Моды Aurora. Physical device startup not yet verified. QA signing differs; back up private app data before uninstall. No proprietary game files."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SMAPI-Aurora-v0.9.1-Mod-Manager-QA
          path: ${{ runner.temp }}/aurora-v091/dist/
          if-no-files-found: error
          retention-days: 14
