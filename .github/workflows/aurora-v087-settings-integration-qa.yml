name: Aurora v0.8.7 SMAPI Settings version integration QA
on:
  push:
    paths:
      - 'junimogate-bridge/version-manager/**'
      - 'junimogate-bridge/settings-patch/**'
      - '.github/workflows/aurora-v087-settings-integration-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pin build tools and upstream APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aurora-v087/"{dist,classes,newdex,staged}
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          for program in aapt d8 zipalign apksigner; do test -x "$BUILD_TOOLS/$program"; done
          test -s "$ANDROID_HOME/platforms/android-35/android.jar"
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"
          curl -fL --retry 3 --silent --show-error -o "$RUNNER_TEMP/aurora-v087/base.apk" \
            https://github.com/marocto1/SMAPI-Aurora/releases/download/v0.8.6-version-settings-qa/SMAPI-Aurora-v0.8.6-Version-Settings-arm64-QA.apk
          echo "e5e2f7758bcdcd994ebb96f6defce50987e93086ee5d2079e0593f715795a8c6  $RUNNER_TEMP/aurora-v087/base.apk" | sha256sum -c
          curl -fL --retry 3 --silent --show-error -o "$RUNNER_TEMP/aurora-v087/apktool.jar" \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  $RUNNER_TEMP/aurora-v087/apktool.jar" | sha256sum -c

      - name: Decode original package and extract managed SMAPI settings assembly
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx3072m -jar "$RUNNER_TEMP/aurora-v087/apktool.jar" d -s -f \
            "$RUNNER_TEMP/aurora-v087/base.apk" -o "$RUNNER_TEMP/aurora-v087/decoded"
          test -s "$RUNNER_TEMP/aurora-v087/decoded/classes3.dex"
          python3 - "$RUNNER_TEMP/aurora-v087/decoded" "$RUNNER_TEMP/aurora-v087/staged" <<'PY'
          import pathlib,struct,sys
          root,output=map(pathlib.Path,sys.argv[1:])
          data=(root/"lib/arm64-v8a/lib_JunimoGate.App.dll.so").read_bytes()
          assert data[:6]==b"\x7fELF\x02\x01"
          shoff=struct.unpack_from("<Q",data,0x28)[0]
          shsize=struct.unpack_from("<H",data,0x3a)[0]
          shcount=struct.unpack_from("<H",data,0x3c)[0]
          shstridx=struct.unpack_from("<H",data,0x3e)[0]
          hdr=shoff+shstridx*shsize
          start,length=struct.unpack_from("<QQ",data,hdr+24)
          names=data[start:start+length]
          found=[]
          for i in range(shcount):
              pos=shoff+i*shsize
              no=struct.unpack_from("<I",data,pos)[0]
              name=names[no:].split(b"\0",1)[0]
              if name==b"payload":
                  off,size=struct.unpack_from("<QQ",data,pos+24)
                  found.append(data[off:off+size])
          assert len(found)==1 and found[0].startswith(b"MZ")
          assert b"JunimoGate.App" in found[0]
          (output/"original-app.dll").write_bytes(found[0])
          # Resolve metadata references with original managed assemblies from the
          # pinned Aurora APK; never put these temporary copies in the release.
          for lib in (root/"lib/arm64-v8a").glob("lib_*.dll.so"):
              raw=lib.read_bytes()
              if raw[:6]!=b"\x7fELF\x02\x01":
                  continue
              sh=struct.unpack_from("<Q",raw,0x28)[0]
              hs=struct.unpack_from("<H",raw,0x3a)[0]
              cnt=struct.unpack_from("<H",raw,0x3c)[0]
              names_index=struct.unpack_from("<H",raw,0x3e)[0]
              ns=sh+names_index*hs
              start,size=struct.unpack_from("<QQ",raw,ns+24)
              table=raw[start:start+size]
              for idx in range(cnt):
                  pos=sh+idx*hs
                  no=struct.unpack_from("<I",raw,pos)[0]
                  if table[no:].split(b"\0",1)[0]!=b"payload":
                      continue
                  off,length=struct.unpack_from("<QQ",raw,pos+24)
                  payload=raw[off:off+length]
                  if payload.startswith(b"MZ"):
                      (output/lib.name[4:-3]).write_bytes(payload)
          assert (output/"JunimoGate.Mods.dll").exists(), "Missing App metadata dependency"
          print("PASS: decoded managed SMAPI Settings assembly and private build-time dependency references")
          PY

      - name: Patch managed SettingsFragment with Aurora version settings entry
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project junimogate-bridge/settings-patch/AuroraSettingsPatch.csproj -c Release -- \
            "$RUNNER_TEMP/aurora-v087/staged/original-app.dll" \
            "$RUNNER_TEMP/aurora-v087/staged/patched-app.dll"
          test -s "$RUNNER_TEMP/aurora-v087/staged/patched-app.dll"
          python3 junimogate-bridge/version-manager/rewrap_managed_app_elf.py \
            "$RUNNER_TEMP/aurora-v087/decoded/lib/arm64-v8a/lib_JunimoGate.App.dll.so" \
            "$RUNNER_TEMP/aurora-v087/staged/patched-app.dll" \
            "$RUNNER_TEMP/aurora-v087/staged/patched-app.so"
          cp "$RUNNER_TEMP/aurora-v087/staged/patched-app.so" \
            "$RUNNER_TEMP/aurora-v087/decoded/lib/arm64-v8a/lib_JunimoGate.App.dll.so"

      - name: Compile version settings deep-link Android entry
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'INTENT_PAGE' junimogate-bridge/version-manager/AuroraVersionActivity.java
          javac --release 8 -encoding UTF-8 \
            -cp "$ANDROID_HOME/platforms/android-35/android.jar" \
            -d "$RUNNER_TEMP/aurora-v087/classes" \
            junimogate-bridge/version-manager/AuroraVersionActivity.java
          "$BUILD_TOOLS/d8" --min-api 26 --lib "$ANDROID_HOME/platforms/android-35/android.jar" \
            --output "$RUNNER_TEMP/aurora-v087/newdex" \
            "$RUNNER_TEMP/aurora-v087/classes/org/junimogate/aurora/AuroraVersionActivity.class"
          cp "$RUNNER_TEMP/aurora-v087/newdex/classes.dex" \
            "$RUNNER_TEMP/aurora-v087/decoded/classes3.dex"
          python3 junimogate-bridge/version-manager/bump_repair_version.py \
            "$RUNNER_TEMP/aurora-v087/decoded"

      - name: Rebuild, align and sign APK
        shell: bash
        run: |
          set -euo pipefail
          java -Xmx3072m -jar "$RUNNER_TEMP/aurora-v087/apktool.jar" b \
            "$RUNNER_TEMP/aurora-v087/decoded" -o "$RUNNER_TEMP/aurora-v087/unsigned.apk"
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 "$RUNNER_TEMP/aurora-v087/unsigned.apk" \
            "$RUNNER_TEMP/aurora-v087/aligned.apk"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$RUNNER_TEMP/aurora-v087/aligned.apk"
          export QA_PASS="$(openssl rand -hex 18)"
          keytool -genkeypair -noprompt -alias aurora-qa -keyalg RSA -keysize 3072 -validity 3650 \
            -dname "CN=SMAPI Aurora v0.8.7 Settings QA,O=Marocto" \
            -storetype PKCS12 -keystore "$RUNNER_TEMP/aurora-v087/key.p12" \
            -storepass "$QA_PASS" -keypass "$QA_PASS" >/dev/null
          APK="$RUNNER_TEMP/aurora-v087/dist/SMAPI-Aurora-v0.8.7-Settings-Versions-arm64-QA.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/aurora-v087/key.p12" \
            --ks-type PKCS12 --ks-key-alias aurora-qa --ks-pass env:QA_PASS \
            --key-pass env:QA_PASS --v2-signing-enabled true --v3-signing-enabled true \
            --out "$APK" "$RUNNER_TEMP/aurora-v087/aligned.apk"
          unset QA_PASS
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

      - name: Audit patched UI and unchanged GameHost/SMAPI/Core
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/aurora-v087/dist/SMAPI-Aurora-v0.8.7-Settings-Versions-arm64-QA.apk"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/aurora-v087/aapt.txt"
          grep -Fq "package: name='org.junimogate.app' versionCode='18' versionName='0.8.7-settings-versions-qa'" "$RUNNER_TEMP/aurora-v087/aapt.txt"
          python3 - "$RUNNER_TEMP/aurora-v087/base.apk" "$APK" "$RUNNER_TEMP/aurora-v087/staged/patched-app.dll" <<'PY'
          import sys,zipfile,struct
          old,new,dll=sys.argv[1:]
          target="lib/arm64-v8a/lib_JunimoGate.App.dll.so"
          with zipfile.ZipFile(old) as a,zipfile.ZipFile(new) as b:
              assert a.testzip() is None and b.testzip() is None
              names=set(a.namelist())
              assert names==set(b.namelist())
              changed={n for n in names if not n.startswith("META-INF/") and a.read(n)!=b.read(n)}
              assert changed=={target,"classes3.dex","AndroidManifest.xml"},changed
              pe=b.read(target)
              off=struct.unpack_from("<Q",pe,0x28)[0]
              count=struct.unpack_from("<H",pe,0x3c)[0]
              stride=struct.unpack_from("<H",pe,0x3a)[0]
              ix=struct.unpack_from("<H",pe,0x3e)[0]
              sn=off+ix*stride
              start,size=struct.unpack_from("<QQ",pe,sn+24)
              strings=pe[start:start+size]
              sections=[]
              for i in range(count):
                  pos=off+i*stride
                  no=struct.unpack_from("<I",pe,pos)[0]
                  if strings[no:].split(b"\0")[0]==b"payload":
                      o,l=struct.unpack_from("<QQ",pe,pos+24)
                      sections.append(pe[o:o+l])
              assert sections==[open(dll,"rb").read()]
              assert "lib/arm64-v8a/lib_JunimoGate.Core.dll.so" in names
              assert any(n.startswith("assets/smapi-managed/") for n in names)
              assert not any(n.lower().endswith("/stardewvalley.dll") for n in names)
              print("PASS: managed SMAPI Settings entry patched, Core signer policy and GameHost preserved")
          PY
          (cd "$RUNNER_TEMP/aurora-v087/dist" && sha256sum *.apk > SHA256SUMS.txt)
          echo "PASS: version settings accessible from native SMAPI Settings tab and Aurora Settings." >> "$GITHUB_STEP_SUMMARY"
          echo "Unverified until user device test; no commercial game APKs or DLLs bundled." >> "$GITHUB_STEP_SUMMARY"

      - name: Create release notes and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/aurora-v087/dist/READ-ME-FIRST.txt" <<'EOF'
          SMAPI Aurora v0.8.7 Android ARM64 experimental QA.
          VERSION SETTINGS: Open through Aurora Settings or the internal SMAPI Settings tab.
          Button in SMAPI Settings opens Aurora version controls directly.
          Shows installed version and verified 1.6.15.3 build 245; offers
          private configured Google Drive source and local APKS installer.
          Installed game does not require downloading again.
          Existing v0.8.5 Core acceptance of Android-installed single signer is intact.
          Not tested on affected Android device. Back up saves, mods, and
          launcher app data before removing/updating any earlier QA APK.
          Temporary APK signing certificates may prevent in-place updates.
          No paid game data in release.
          EOF
          TAG=v0.8.7-settings-versions-qa
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release exists; retain original signed artifacts."
          else
            gh release create "$TAG" \
              "$RUNNER_TEMP/aurora-v087/dist/SMAPI-Aurora-v0.8.7-Settings-Versions-arm64-QA.apk" \
              "$RUNNER_TEMP/aurora-v087/dist/SHA256SUMS.txt" \
              "$RUNNER_TEMP/aurora-v087/dist/READ-ME-FIRST.txt" \
              --prerelease --title "SMAPI Aurora v0.8.7 — Settings > Version Settings" \
              --notes "Experimental Android ARM64 QA. Adds Settings > Version Settings to the original managed SMAPI Settings tab via targeted Cecil injection plus Aurora Java UI navigation. Supports the verified 1.6.15.3 build 245 catalogue and optional in-app private Drive download, preserving v0.8.5 Core signer compatibility, SMAPI runtime and Android16 fix. Download requires one-time private source configuration if missing. Game launch not confirmed on the device. Back up data before replacing signed QA APKs."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SMAPI-Aurora-v0.8.7-Settings-Versions-QA
          path: ${{ runner.temp }}/aurora-v087/dist/
          retention-days: 14
          if-no-files-found: error
