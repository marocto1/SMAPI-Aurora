name: Aurora Android 16 Split APK Prep Fix - Full SMAPI QA
on:
  push:
    paths:
      - 'junimogate-bridge/android-split-source-fix.patch'
      - 'junimogate-bridge/version-manager/rewrap_managed_elf.py'
      - 'junimogate-bridge/version-manager/patch_android_bridge_apk.py'
      - '.github/workflows/aurora-android16-split-fix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-patched-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.312'
      - name: Pin source and apply narrow Android 16 split API fix
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/leontismaro/JunimoGate.git "$RUNNER_TEMP/JunimoGate"
          git -C "$RUNNER_TEMP/JunimoGate" checkout 029eafed917ae853d6c0a59330ee273524168296
          git -C "$RUNNER_TEMP/JunimoGate" apply --check "$GITHUB_WORKSPACE/junimogate-bridge/android-split-source-fix.patch"
          git -C "$RUNNER_TEMP/JunimoGate" apply "$GITHUB_WORKSPACE/junimogate-bridge/android-split-source-fix.patch"
          test "$(git -C "$RUNNER_TEMP/JunimoGate" diff --name-only)" = src/JunimoGate.Android/AndroidPackageInstallationSnapshotProvider.cs
          grep -Fq "applicationInfo.SplitNames" "$RUNNER_TEMP/JunimoGate/src/JunimoGate.Android/AndroidPackageInstallationSnapshotProvider.cs"
          test -d "$RUNNER_TEMP/JunimoGate/src/JunimoGate.Core"
          mkdir -p "$RUNNER_TEMP/JunimoGate/artifacts/nuget"

      - name: Install .NET Android and build actual patched game package snapshot provider
        shell: bash
        run: |
          set -euo pipefail
          dotnet workload install android --skip-manifest-update
          dotnet build "$RUNNER_TEMP/JunimoGate/src/JunimoGate.Android/JunimoGate.Android.csproj" \
            -c Release --framework net9.0-android35.0 \
            --verbosity minimal --nologo
          LIB="$RUNNER_TEMP/JunimoGate/src/JunimoGate.Android/bin/Release/net9.0-android35.0/JunimoGate.Android.dll"
          test -s "$LIB"
          sha256sum "$LIB"
          echo "PATCHED_DLL=$LIB" >> "$GITHUB_ENV"

      - name: Download verified v0.8 complete SMAPI APK and rewrap modified DLL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aurora" "$RUNNER_TEMP/aurora/dist"
          curl -fL --retry 3 --silent --show-error -o "$RUNNER_TEMP/aurora/baseline.apk" \
            https://github.com/marocto1/SMAPI-Aurora/releases/download/v0.8.0-version-manager-qa/SMAPI-Aurora-v0.8.0-Version-Manager-SMAPI-QA-arm64.apk
          echo "14ee61ecce19d3f8efdd891b9342ab8814e893136ace51d2aac3add1caef33e5  $RUNNER_TEMP/aurora/baseline.apk" | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          import os,zipfile
          root=Path(os.environ['RUNNER_TEMP'])/'aurora'
          with zipfile.ZipFile(root/'baseline.apk') as z:
              file='lib/arm64-v8a/lib_JunimoGate.Android.dll.so'
              (root/'original-managed.so').write_bytes(z.read(file))
          PY
          python3 junimogate-bridge/version-manager/rewrap_managed_elf.py \
            "$RUNNER_TEMP/aurora/original-managed.so" "$PATCHED_DLL" \
            "$RUNNER_TEMP/aurora/new-managed.so"
          readelf -S "$RUNNER_TEMP/aurora/new-managed.so" | grep -F payload
          python3 junimogate-bridge/version-manager/patch_android_bridge_apk.py \
            "$RUNNER_TEMP/aurora/baseline.apk" \
            "$RUNNER_TEMP/aurora/new-managed.so" \
            "$RUNNER_TEMP/aurora/unzipaligned.apk"

      - name: Align 16K native payload and sign APK with disposable QA certificate
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 \
            "$RUNNER_TEMP/aurora/unzipaligned.apk" "$RUNNER_TEMP/aurora/aligned.apk"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$RUNNER_TEMP/aurora/aligned.apk"
          export QA_PASS="$(openssl rand -hex 18)"
          keytool -genkeypair -noprompt -alias aurora-qa -keyalg RSA -keysize 3072 \
            -validity 3650 -dname "CN=SMAPI Aurora v0.8.1 QA,O=Marocto" \
            -storetype PKCS12 -keystore "$RUNNER_TEMP/aurora/key.p12" \
            -storepass "$QA_PASS" -keypass "$QA_PASS" >/dev/null
          APK="$RUNNER_TEMP/aurora/dist/SMAPI-Aurora-v0.8.1-Android16-Split-Fix-arm64-QA.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/aurora/key.p12" \
            --ks-type PKCS12 --ks-key-alias aurora-qa \
            --ks-pass env:QA_PASS --key-pass env:QA_PASS \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out "$APK" "$RUNNER_TEMP/aurora/aligned.apk"
          unset QA_PASS
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/aurora/apk-package.txt"
          grep -Fq "package: name='org.junimogate.app'" "$RUNNER_TEMP/aurora/apk-package.txt"
          grep -Fq "launchable-activity: name='org.junimogate.aurora.AuroraVersionActivity'" "$RUNNER_TEMP/aurora/apk-package.txt"

      - name: Audit exactly one repaired Android DLL and full SMAPI runtime preservation
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/aurora/dist/SMAPI-Aurora-v0.8.1-Android16-Split-Fix-arm64-QA.apk"
          python3 junimogate-bridge/version-manager/patch_android_bridge_apk.py \
            "$RUNNER_TEMP/aurora/baseline.apk" \
            "$RUNNER_TEMP/aurora/new-managed.so" "$APK" --verify-only
          (cd "$RUNNER_TEMP/aurora/dist" && sha256sum *.apk > SHA256SUMS.txt)
          echo "PASS: Android SplitSourceDirs now paired first with ApplicationInfo.SplitNames. Game signer and integrity verification unchanged." >> "$GITHUB_STEP_SUMMARY"
          echo "NOT DEVICE-TESTED: original Android 16 crash should be retested with log export." >> "$GITHUB_STEP_SUMMARY"

      - name: Installation caveats and source correspondence
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/aurora/dist/READ-ME-FIRST.txt" <<'EOF'
          SMAPI Aurora v0.8.1 Android 16 split package preparation hotfix QA.
          This APK patches one Android boundary .NET assembly while preserving
          the original SMAPI/GameHost, native game runtime, and version manager.

          Fix: read ApplicationInfo.SplitNames alongside SplitSourceDirs first;
          use PackageInfo.SplitNames only if length-aligned, and otherwise fail
          closed without guessing split APK identities. The game signature and
          compatibility checks are not bypassed.

          This build IS NOT DEVICE TESTED and does not prove that Stardew Valley
          will start or SMAPI Mods will load. Check the launcher log after testing.

          This is a different temporary QA signing certificate, despite using
          the same Android package ID as the previous Aurora and JunimoGate.
          Do not uninstall prior builds before backing up any private app data,
          settings, mods, and game saves.
          Full patch and source: https://github.com/marocto1/SMAPI-Aurora
          Full upstream source: https://github.com/leontismaro/JunimoGate
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: SMAPI-Aurora-v0.8.1-Android16-Split-Prep-Fix-UNTESTED
          path: ${{ runner.temp }}/aurora/dist/
          if-no-files-found: error
          retention-days: 14
