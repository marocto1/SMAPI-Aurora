name: Aurora v0.9.4.1 In-App Workshop Import QA
on:
  push:
    paths:
      - 'junimogate-bridge/mod-manager/**'
      - '.github/workflows/aurora-v09411-inapp-workshop-import-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test safe in-app Workshop injection and no Nexus API use
        run: |
          set -euo pipefail
          python3 -m unittest discover -s junimogate-bridge/mod-manager -p 'test_*.py' -v
          WORKSHOP=junimogate-bridge/mod-manager/AuroraWorkshopActivity.java
          TABS=junimogate-bridge/mod-manager/AuroraWorkshopTabsView.java
          test -s "$WORKSHOP"
          test -s "$TABS"
          grep -Fq 'new WebView(this)' "$WORKSHOP"
          grep -Fq 'setDownloadListener' "$WORKSHOP"
          grep -Fq 'Manual Download' "$WORKSHOP"
          grep -Fq 'AuroraWorkshopActivity.class' "$TABS"
          grep -Fq 'requestOriginalZipImport()' "$TABS"
          grep -Fq 'button.performClick()' "$TABS"
          grep -Fq 'AuroraWorkshopTabsView.requestOriginalZipImport()' "$WORKSHOP"
          if grep -Ei 'api[.]nexusmods[.]com|apikey|HttpURLConnection|FileOutputStream|FileWriter|RandomAccessFile|ProcessBuilder' "$WORKSHOP"; then
            echo "Workshop must not use Nexus API or directly mutate private mod library" >&2
            exit 1
          fi
          if grep -E 'FileOutputStream|FileWriter|RandomAccessFile|[.]delete[(]|[.]renameTo[(]|[.]mkdir[(]|ProcessBuilder' junimogate-bridge/mod-manager/AuroraModOverviewActivity.java; then
            echo "Mod overview must remain read-only" >&2; exit 1
          fi
      - name: Acquire pinned baseline and Android build tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aurora-v0941"/{classes,newdex,dist}
          B="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "BUILD_TOOLS=$B" >> "$GITHUB_ENV"
          test -s "$ANDROID_HOME/platforms/android-35/android.jar"
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/aurora-v0941/base.apk" https://github.com/marocto1/SMAPI-Aurora/releases/download/v0.8.9-boot-recovery-qa/SMAPI-Aurora-v0.8.9-Boot-Recovery-arm64-QA.apk
          echo "8b1a87249b7169b7f5dc40d8dcec9e9efc0f4eb84178ecb6ce9c3c5c638f0b60  $RUNNER_TEMP/aurora-v0941/base.apk" | sha256sum -c
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/aurora-v0941/apktool.jar" https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  $RUNNER_TEMP/aurora-v0941/apktool.jar" | sha256sum -c
      - name: Compile read-only dashboard alongside unchanged version manager
        run: |
          set -euo pipefail
          javac --release 8 -encoding UTF-8 -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d "$RUNNER_TEMP/aurora-v0941/classes" junimogate-bridge/version-manager/AuroraVersionActivity.java junimogate-bridge/mod-manager/AuroraModOverviewActivity.java junimogate-bridge/mod-manager/AuroraWorkshopActivity.java junimogate-bridge/mod-manager/AuroraWorkshopTabsView.java
          find "$RUNNER_TEMP/aurora-v0941/classes" -name '*.class' -print0 | xargs -0 "$BUILD_TOOLS/d8" --min-api 26 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output "$RUNNER_TEMP/aurora-v0941/newdex"
          test -s "$RUNNER_TEMP/aurora-v0941/newdex/classes.dex"
      - name: Inject shortcut into untouched v0.8.9
        run: |
          set -euo pipefail
          java -Xmx3072m -jar "$RUNNER_TEMP/aurora-v0941/apktool.jar" d -s -f "$RUNNER_TEMP/aurora-v0941/base.apk" -o "$RUNNER_TEMP/aurora-v0941/decoded"
          test -s "$RUNNER_TEMP/aurora-v0941/decoded/classes3.dex"
          cp "$RUNNER_TEMP/aurora-v0941/newdex/classes.dex" "$RUNNER_TEMP/aurora-v0941/decoded/classes3.dex"
          python3 junimogate-bridge/mod-manager/inject_mod_manager.py "$RUNNER_TEMP/aurora-v0941/decoded"
      - name: Repackage and sign ARM64 QA
        run: |
          set -euo pipefail
          java -Xmx3072m -jar "$RUNNER_TEMP/aurora-v0941/apktool.jar" b "$RUNNER_TEMP/aurora-v0941/decoded" -o "$RUNNER_TEMP/aurora-v0941/unsigned.apk"
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 "$RUNNER_TEMP/aurora-v0941/unsigned.apk" "$RUNNER_TEMP/aurora-v0941/aligned.apk"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$RUNNER_TEMP/aurora-v0941/aligned.apk"
          export QA_PASS="$(openssl rand -hex 18)"
          keytool -genkeypair -noprompt -alias aurora-qa -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=Aurora Mod Manager v0.9.1 QA,O=Marocto" -storetype PKCS12 -keystore "$RUNNER_TEMP/aurora-v0941/key.p12" -storepass "$QA_PASS" -keypass "$QA_PASS" >/dev/null
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/aurora-v0941/key.p12" --ks-type PKCS12 --ks-key-alias aurora-qa --ks-pass env:QA_PASS --key-pass env:QA_PASS --v2-signing-enabled true --v3-signing-enabled true --out "$RUNNER_TEMP/aurora-v0941/dist/SMAPI-Aurora-v0.9.4.1-InApp-Workshop-Import-arm64-QA.apk" "$RUNNER_TEMP/aurora-v0941/aligned.apk"
          unset QA_PASS
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/aurora-v0941/dist/SMAPI-Aurora-v0.9.4.1-InApp-Workshop-Import-arm64-QA.apk"
      - name: Audit binary compatibility with phone-tested build
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/aurora-v0941/dist/SMAPI-Aurora-v0.9.4.1-InApp-Workshop-Import-arm64-QA.apk"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/aurora-v0941/badging.txt"
          grep -Fq "package: name='org.junimogate.app' versionCode='25' versionName='0.9.4.1-workshop-inapp-qa'" "$RUNNER_TEMP/aurora-v0941/badging.txt"
          grep -Fq "launchable-activity: name='org.junimogate.app.MainActivity'" "$RUNNER_TEMP/aurora-v0941/badging.txt"
          "$BUILD_TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/aurora-v0941/manifest.txt"
          grep -Fq 'AuroraModOverviewActivity' "$RUNNER_TEMP/aurora-v0941/manifest.txt"
          grep -Fq 'AuroraWorkshopActivity' "$RUNNER_TEMP/aurora-v0941/manifest.txt"
          "$BUILD_TOOLS/aapt" dump xmltree "$APK" res/layout/fragment_mods.xml > "$RUNNER_TEMP/aurora-v0941/mods-layout.txt"
          grep -Fq 'AuroraWorkshopTabsView' "$RUNNER_TEMP/aurora-v0941/mods-layout.txt"
          python3 - "$RUNNER_TEMP/aurora-v0941/base.apk" "$APK" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as a,zipfile.ZipFile(sys.argv[2]) as b:
              assert a.testzip() is b.testzip() is None
              old,new=set(a.namelist()),set(b.namelist())
              assert old<=new,old-new
              for name in old:
                  if name.startswith("META-INF/"):continue
                  if a.read(name)!=b.read(name):
                      assert name in {"classes3.dex","AndroidManifest.xml","resources.arsc","res/layout/fragment_mods.xml"},name
              assert all(n.startswith("res/") or n.startswith("META-INF/") for n in new-old)
              for name in old:
                  if name.startswith("lib/") or name.startswith("assets/smapi-managed/"):
                      assert a.read(name)==b.read(name),name
              assert not any(n.lower().endswith("/stardewvalley.dll") for n in new)
              print("PASS: all managed original Mods, GameHost and SMAPI assets byte-identical")
          PY
          (cd "$RUNNER_TEMP/aurora-v0941/dist" && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish QA APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/aurora-v0941/dist/READ-ME-FIRST.txt" <<'EOF'
          Aurora v0.9.4.1 In-App Workshop Import QA — Android ARM64.
          Standard Aurora Mods/Groups already supports ZIP import, groups,
          enable/disable, dependency fixing, config editing and deletion.
          NEW: Workshop tab is INSIDE the original Aurora Mods screen.
          Import ZIP returns to original Mods tab and opens the existing
          safe archive picker (when launched from that tab).
          C# installer remains responsible for validation and all writes.
          Uses Aurora's original green Material3 colors and typography.
          Nexus official website is browsed inside an Android WebView,
          WITHOUT API key, Nexus API or scraping.
          Browser handles user-selected downloads. Return to Mods->Import
          and select ZIP from Downloads. Direct one-click installation is
          NOT possible without authorised URL / integration.
          Original compiled .NET SMAPI and mod manager are unchanged.
          Not yet tested on physical Android phone.
          QA signing key differs: do not uninstall prior Aurora before
          backing up private mods/settings/saves; don't uninstall the game.
          EOF
          TAG=v0.9.4.1-workshop-inapp-qa
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing signed QA artifact retained"
          else
            gh release create "$TAG" "$RUNNER_TEMP/aurora-v0941/dist/SMAPI-Aurora-v0.9.4.1-InApp-Workshop-Import-arm64-QA.apk" "$RUNNER_TEMP/aurora-v0941/dist/READ-ME-FIRST.txt" "$RUNNER_TEMP/aurora-v0941/dist/SHA256SUMS.txt" --prerelease --title "SMAPI Aurora v0.9.4.1 — In-App Workshop / Import QA" --notes "In-App Workshop: visible tab inside original Aurora Mods screen, native Aurora green theme, real Nexus site via in-app WebView, no Nexus API/key. User downloads on official Nexus in browser, then taps Import ZIP to return to Mods and open original safe archive picker automatically. User still selects and confirms ZIP; no direct one-click installation from Nexus. Original C# SMAPI/Mods binaries byte-identical with phone-tested v0.8.9. QA signing differs: back up app-private mods/saves BEFORE uninstall. Not tested on a phone."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SMAPI-Aurora-v0.9.4.1-InApp-Workshop-Import-QA
          path: ${{ runner.temp }}/aurora-v0941/dist/
          if-no-files-found: error
          retention-days: 14
