name: Build SMAPI Aurora Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout Aurora source overlay
        uses: actions/checkout@v4

      - name: Select compile-only reference source
        env:
          GAME_REFS_URL: ${{ secrets.AURORA_GAME_REFS_URL }}
          GAME_REFS_SHA256: ${{ secrets.AURORA_GAME_REFS_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$GAME_REFS_URL" && -n "$GAME_REFS_SHA256" ]]; then
            if [[ ! "$GAME_REFS_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]; then
              echo "::error::Invalid SHA256 for private reference archive"
              exit 1
            fi
            echo "AURORA_REFS_MODE=private" >> "$GITHUB_ENV"
          elif [[ -z "$GAME_REFS_URL" && -z "$GAME_REFS_SHA256" ]]; then
            echo "AURORA_REFS_MODE=public" >> "$GITHUB_ENV"
            echo "::notice::Using desktop compile-only API references from StardewModders 1.6.15, not actual mobile game DLLs. Successful compile does not certify Android runtime compatibility."
          else
            echo "::error::Provide both private reference secrets or neither"
            exit 1
          fi

      - name: Clone pinned upstream SMAPI Loader
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/NRTnarathip/SMAPILoader.git .aurora-build/SMAPILoader
          git -C .aurora-build/SMAPILoader checkout 092c6864838dd2118d216cb3e03f3c731ad17c08
          python3 apply_aurora.py .aurora-build/SMAPILoader --dry-run
          python3 apply_aurora.py .aurora-build/SMAPILoader

      - name: Acquire version-pinned compiler reference assemblies
        shell: bash
        env:
          GAME_REFS_URL: ${{ secrets.AURORA_GAME_REFS_URL }}
          GAME_REFS_SHA256: ${{ secrets.AURORA_GAME_REFS_SHA256 }}
        run: |
          set -euo pipefail
          DEST=.aurora-build/SMAPI-Android-1.6/src/DependenciesDll
          mkdir -p "$DEST"
          if [[ "$AURORA_REFS_MODE" == "private" ]]; then
            curl --fail --location --retry 2 --silent --show-error \
              --output "$RUNNER_TEMP/aurora-private-references.zip" "$GAME_REFS_URL"
            printf '%s  %s\n' "$GAME_REFS_SHA256" "$RUNNER_TEMP/aurora-private-references.zip" | sha256sum --check --status
            python3 scripts/prepare_android_build.py \
              --archive "$RUNNER_TEMP/aurora-private-references.zip" --target "$DEST"
            rm -f "$RUNNER_TEMP/aurora-private-references.zip"
          else
            git clone --filter=blob:none https://github.com/StardewModders/mod-reference-assemblies.git "$RUNNER_TEMP/mod-reference-assemblies"
            git -C "$RUNNER_TEMP/mod-reference-assemblies" checkout 0141355fecb8536715ecff22f99374b5e632cbed
            cp "$RUNNER_TEMP/mod-reference-assemblies/Stardew Valley.dll" "$DEST/StardewValley.dll"
            cp "$RUNNER_TEMP/mod-reference-assemblies/StardewValley.GameData.dll" "$DEST/"
            cp "$RUNNER_TEMP/mod-reference-assemblies/MonoGame.Framework.dll" "$DEST/"
            # Never place reference-only API stubs into distributable APK output.
            echo "::notice::Reference-only build. Runtime compatibility and mobile API parity remain unverified."
          fi
          test -s "$DEST/StardewValley.dll"
          test -s "$DEST/StardewValley.GameData.dll"
          test -s "$DEST/MonoGame.Framework.dll"

      - name: Install Java 17 for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled GitHub Android SDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Android SDK is missing from runner}"
          test -d "$ANDROID_HOME/platforms"
          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"

      - name: Install .NET 9.0.312
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.312'

      - name: Install .NET Android workload
        shell: bash
        run: dotnet workload install android --skip-manifest-update

      - name: Build debug-signed Android arm64 APK
        shell: bash
        run: |
          dotnet publish .aurora-build/SMAPILoader/SMAPIGameLoader/SMAPIGameLoader.csproj \
            --framework net9.0-android --configuration Debug --runtime android-arm64 \
            -p:AndroidPackageFormat=apk -p:AndroidKeyStore=false

      - name: Archive installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SMAPI-Aurora-Android-ARM64-debug
          path: .aurora-build/SMAPILoader/SMAPIGameLoader/bin/Debug/net9.0-android/**/*.apk
          if-no-files-found: error
          retention-days: 7
