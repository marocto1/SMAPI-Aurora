name: Aurora v1.0.0 Stable — Signing & Phone QA Gate
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Require confirmed device QA and long-lived signing secrets
        env:
          APPROVED: ${{ vars.AURORA_V1_ONDEVICE_QA_APPROVED }}
          KEY_B64: ${{ secrets.AURORA_RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.AURORA_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.AURORA_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AURORA_RELEASE_KEY_ALIAS }}
          CERT_SHA: ${{ secrets.AURORA_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          test "$APPROVED" = "true" || { echo "BLOCK: v1 stable requires Android on-device QA approval"; exit 1; }
          test -n "$KEY_B64" && test -n "$KEYSTORE_PASS" && test -n "$KEY_PASS" && test -n "$KEY_ALIAS" && test -n "$CERT_SHA" || {
            echo "BLOCK: persistent release signing secret or pinned cert is absent"; exit 1;
          }
          echo "PASS: explicit QA approval and release signing requirements exist"
      - name: Test safe in-app Workshop injection and no Nexus API use
        run: |
          set -euo pipefail
          python3 -m unittest discover -s junimogate-bridge/mod-manager -p 'test_*.py' -v
          python3 -m unittest discover -s junimogate-bridge/v1 -p 'test_*.py' -v
          grep -Fq 'Intent.ACTION_CREATE_DOCUMENT' junimogate-bridge/v1/AuroraBackupActivity.java
          grep -Fq 'ROOT_SAVES = "saves/"' junimogate-bridge/v1/AuroraBackupActivity.java
          grep -Fq 'smapi-aurora-full-backup/v1' junimogate-bridge/v1/AuroraBackupActivity.java
          if grep -Fq 'this::downloadAndInstallFromDrive'             <(sed -n '/private void buildVersionsPage(/,/private String gameVersion(/p' junimogate-bridge/v1/AuroraVersionActivity.java); then
            echo "Google Drive option must not be visible in Aurora v1" >&2; exit 1
          fi
          WORKSHOP=junimogate-bridge/mod-manager/AuroraWorkshopActivity.java
          TABS=junimogate-bridge/mod-manager/AuroraWorkshopTabsView.java
          test -s "$WORKSHOP"
          test -s "$TABS"
          grep -Fq 'new WebView(this)' "$WORKSHOP"
          grep -Fq 'setDownloadListener' "$WORKSHOP"
          grep -Fq 'Manual Download' "$WORKSHOP"
          grep -Fq 'AuroraWorkshopActivity.class' "$TABS"
          grep -Fq 'requestOriginalZipImport()' "$TABS"
          grep -Fq 'button.performClick()' "$TABS"
          grep -Fq 'AuroraDirectDownloads.download(' "$WORKSHOP"
          grep -Fq 'validateArchive(outputFile)' junimogate-bridge/mod-manager/AuroraDirectDownloads.java junimogate-bridge/v1/AuroraBackupActivity.java
          grep -Fq 'AuroraWorkshopTabsView.requestOriginalZipImport()' "$WORKSHOP"
          if grep -Ei 'api[.]nexusmods[.]com|apikey|HttpURLConnection|FileOutputStream|FileWriter|RandomAccessFile|ProcessBuilder' "$WORKSHOP"; then
            echo "Workshop must not use Nexus API or directly mutate private mod library" >&2
            exit 1
          fi
          if grep -E 'FileOutputStream|FileWriter|RandomAccessFile|[.]delete[(]|[.]renameTo[(]|[.]mkdir[(]|ProcessBuilder' junimogate-bridge/mod-manager/AuroraModOverviewActivity.java; then
            echo "Mod overview must remain read-only" >&2; exit 1
          fi
      - name: Acquire pinned baseline and Android build tools
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aurora-v100stable"/{classes,newdex,dist}
          B="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          echo "BUILD_TOOLS=$B" >> "$GITHUB_ENV"
          test -s "$ANDROID_HOME/platforms/android-35/android.jar"
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/aurora-v100stable/base.apk" https://github.com/marocto1/SMAPI-Aurora/releases/download/v0.8.9-boot-recovery-qa/SMAPI-Aurora-v0.8.9-Boot-Recovery-arm64-QA.apk
          echo "8b1a87249b7169b7f5dc40d8dcec9e9efc0f4eb84178ecb6ce9c3c5c638f0b60  $RUNNER_TEMP/aurora-v100stable/base.apk" | sha256sum -c
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/aurora-v100stable/apktool.jar" https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo "dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  $RUNNER_TEMP/aurora-v100stable/apktool.jar" | sha256sum -c
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/aurora-v100stable/firstparty-smoke.zip" https://github.com/marocto1/SMAPI-Aurora/releases/download/v0.8.8-smapi-smoke-qa/Aurora-SMAPI-Smoke-Mod-v1.0.0.zip
          echo "c314427ab39d5c061938fccf50a089c811040a8087a7cd946489d69561e67268  $RUNNER_TEMP/aurora-v100stable/firstparty-smoke.zip" | sha256sum -c
      - name: Compile read-only dashboard alongside unchanged version manager
        run: |
          set -euo pipefail
          javac --release 8 -encoding UTF-8 -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d "$RUNNER_TEMP/aurora-v100stable/classes" junimogate-bridge/v1/AuroraVersionActivity.java junimogate-bridge/mod-manager/AuroraModOverviewActivity.java junimogate-bridge/mod-manager/AuroraWorkshopActivity.java junimogate-bridge/mod-manager/AuroraWorkshopTabsView.java junimogate-bridge/mod-manager/AuroraDirectDownloads.java junimogate-bridge/v1/AuroraBackupActivity.java
          find "$RUNNER_TEMP/aurora-v100stable/classes" -name '*.class' -print0 | xargs -0 "$BUILD_TOOLS/d8" --min-api 26 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output "$RUNNER_TEMP/aurora-v100stable/newdex"
          test -s "$RUNNER_TEMP/aurora-v100stable/newdex/classes.dex"
      - name: Inject shortcut into untouched v0.8.9
        run: |
          set -euo pipefail
          java -Xmx3072m -jar "$RUNNER_TEMP/aurora-v100stable/apktool.jar" d -s -f "$RUNNER_TEMP/aurora-v100stable/base.apk" -o "$RUNNER_TEMP/aurora-v100stable/decoded"
          test -s "$RUNNER_TEMP/aurora-v100stable/decoded/classes3.dex"
          cp "$RUNNER_TEMP/aurora-v100stable/newdex/classes.dex" "$RUNNER_TEMP/aurora-v100stable/decoded/classes3.dex"
          python3 junimogate-bridge/v1/inject_v1.py "$RUNNER_TEMP/aurora-v100stable/decoded"
          python3 - "$RUNNER_TEMP/aurora-v100stable/decoded/apktool.yml" <<'PY'
          import sys
          p=sys.argv[1]
          text=open(p,encoding='utf8').read()
          if 'versionCode: 101' not in text or 'versionName: 1.0.0-rc.2' not in text:
              raise SystemExit("Unexpected RC2 input version")
          text=text.replace('versionCode: 101','versionCode: 102',1)
          # inject_v1 normally writes '1.0.0-rc.2'; final workflow
          # replaces only that exact value, after source comparison above.
          text=text.replace('versionName: 1.0.0-rc.2','versionName: 1.0.0',1)
          open(p,'w',encoding='utf8').write(text)
          PY
      - name: Repackage and sign with persistent v1.0 key
        env:
          KEY_B64: ${{ secrets.AURORA_RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.AURORA_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.AURORA_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AURORA_RELEASE_KEY_ALIAS }}
          CERT_SHA: ${{ secrets.AURORA_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          java -Xmx3072m -jar "$RUNNER_TEMP/aurora-v100stable/apktool.jar" b "$RUNNER_TEMP/aurora-v100stable/decoded" -o "$RUNNER_TEMP/aurora-v100stable/unsigned.apk"
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 "$RUNNER_TEMP/aurora-v100stable/unsigned.apk" "$RUNNER_TEMP/aurora-v100stable/aligned.apk"
          "$BUILD_TOOLS/zipalign" -c -P 16 4 "$RUNNER_TEMP/aurora-v100stable/aligned.apk"
          # Always sign with persistent release key. Never generate QA cert here.
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/aurora-v100stable/stable-key.p12"
          chmod 600 "$RUNNER_TEMP/aurora-v100stable/stable-key.p12"
          APK="$RUNNER_TEMP/aurora-v100stable/dist/SMAPI-Aurora-v1.0.0-Stable-arm64.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/aurora-v100stable/stable-key.p12" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASS --key-pass env:KEY_PASS --v2-signing-enabled true --v3-signing-enabled true --out "$APK" "$RUNNER_TEMP/aurora-v100stable/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/aurora-v100stable/cert.txt"
          python3 - "$RUNNER_TEMP/aurora-v100stable/cert.txt" "$CERT_SHA" <<'PY'
          import sys,re
          info=open(sys.argv[1]).read()
          fingerprints=re.findall(r'(?im)^V[23](?:\.\d+)? Signer: certificate SHA-256 digest: ([a-f0-9]{64})$',info)
          if not fingerprints or set(fingerprints)!={sys.argv[2].strip().lower()}:
              raise SystemExit('BLOCK: actual release signing fingerprint does not match pinned certificate')
          print('PASS: pinned persistent Android release certificate verified')
          PY
          rm -f "$RUNNER_TEMP/aurora-v100stable/stable-key.p12"
      - name: Audit binary compatibility with phone-tested build
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/aurora-v100stable/dist/SMAPI-Aurora-v1.0.0-Stable-arm64.apk"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/aurora-v100stable/badging.txt"
          grep -Fq "package: name='org.junimogate.app' versionCode='101' versionName='1.0.0-rc.2'" "$RUNNER_TEMP/aurora-v100stable/badging.txt"
          grep -Fq "launchable-activity: name='org.junimogate.app.MainActivity'" "$RUNNER_TEMP/aurora-v100stable/badging.txt"
          "$BUILD_TOOLS/aapt" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/aurora-v100stable/manifest.txt"
          grep -Fq 'AuroraModOverviewActivity' "$RUNNER_TEMP/aurora-v100stable/manifest.txt"
          grep -Fq 'AuroraWorkshopActivity' "$RUNNER_TEMP/aurora-v100stable/manifest.txt"
          grep -Fq 'AuroraBackupActivity' "$RUNNER_TEMP/aurora-v100stable/manifest.txt"
          "$BUILD_TOOLS/aapt" dump xmltree "$APK" res/layout/fragment_mods.xml > "$RUNNER_TEMP/aurora-v100stable/mods-layout.txt"
          test -s "$RUNNER_TEMP/aurora-v100stable/mods-layout.txt"
          grep -Fq 'SMAPI Aurora' "$RUNNER_TEMP/aurora-v100stable/badging.txt"
          grep -Fq 'AuroraWorkshopTabsView' "$RUNNER_TEMP/aurora-v100stable/mods-layout.txt"
          python3 - "$RUNNER_TEMP/aurora-v100stable/base.apk" "$APK" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as a,zipfile.ZipFile(sys.argv[2]) as b:
              assert a.testzip() is b.testzip() is None
              old,new=set(a.namelist()),set(b.namelist())
              assert old<=new,old-new
              for name in old:
                  if name.startswith("META-INF/"):continue
                  if a.read(name)!=b.read(name):
                      assert name in {"classes3.dex","AndroidManifest.xml","resources.arsc","res/layout/fragment_mods.xml"},name
              assert all(n.startswith("res/") or n.startswith("META-INF/") for n in new-old)
              for name in old:
                  if name.startswith("lib/") or name.startswith("assets/smapi-managed/"):
                      assert a.read(name)==b.read(name),name
              assert not any(n.lower().endswith("/stardewvalley.dll") for n in new)
              print("PASS: all managed original Mods, GameHost and SMAPI assets byte-identical")
          PY
          (cd "$RUNNER_TEMP/aurora-v100stable/dist" && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish QA APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/aurora-v100stable/dist/READ-ME-FIRST.txt" <<'EOF'
          Aurora v1.0.0 RC2 Full Feature QA — Android ARM64.
          Standard Aurora Mods/Groups already supports ZIP import, groups,
          enable/disable, dependency fixing, config editing and deletion.
          NEW: built-in verified GitHub Release mod downloader in Workshop.
          Author-controlled demo smoke-mod ZIP has pinned SHA-256.
          HTTPS allowlist, redirect/size/ZIP traversal limits, staged hash check.
          After verification, saved to Downloads/Aurora, then original
          SMAPI Aurora Mods picker chooses/confirms installation.
          This is NOT fully automatic one-click installation.
          Nexus continues browsing inside app without Nexus API.
          Original C# .NET GameHost/SMAPI/mod manager binary unchanged.
          This QA release is not device-verified.
          Release key differs from historical QA; this is NOT a normal upgrade from earlier QA APKs.
          Do not uninstall older working Aurora without an independently
          VERIFIED backup of private mods, profiles and saves.
          Do not uninstall separate Stardew Valley app.
          EOF
          TAG=v1.0.0
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing signed QA artifact retained"
          else
            gh release create "$TAG" "$RUNNER_TEMP/aurora-v100stable/dist/SMAPI-Aurora-v1.0.0-Stable-arm64.apk" "$RUNNER_TEMP/aurora-v100stable/dist/READ-ME-FIRST.txt" "$RUNNER_TEMP/aurora-v100stable/dist/SHA256SUMS.txt" --title "SMAPI Aurora v1.0.0 — Stable" --notes "SMAPI Aurora v1.0.0 Stable. Published only after external on-device QA approval and verified persistent signing key. Original SMAPI/GameHost runtime preserved; in-app Workshop, mod libraries, game-version imports, complete user-data/Saves backup/restore, teal/purple light/dark UI. Historical QA certificates differ and cannot update in place; back up old application private data and saves before any uninstall."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: SMAPI-Aurora-v1.0.0-Stable
          path: ${{ runner.temp }}/aurora-v100stable/dist/
          if-no-files-found: error
          retention-days: 14
