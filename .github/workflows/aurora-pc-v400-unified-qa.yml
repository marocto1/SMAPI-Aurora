name: Aurora SMAPI PC v4.0.0 RC1 Unified Connectivity QA
on:
  push:
    paths:
      - 'aurora-pc/**'
      - '.github/workflows/aurora-pc-v400-unified-qa.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pure core tests (without Stardew or SMAPI binaries)
        shell: pwsh
        run: |
          python -m unittest discover -s aurora-pc -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m py_compile aurora-pc/aurora_core.py aurora-pc/aurora_pc_v40.py aurora-pc/coop_v20.py aurora-pc/workshop_v25.py aurora-pc/network_v24.py aurora-pc/safety_v22.py aurora-pc/recovery_v26.py aurora-pc/coop_v27.py aurora-pc/modaudit_v28.py aurora-pc/readiness_v40.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build native Windows exe with Python Tk and PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade "pyinstaller>=6.10,<7"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Aurora-SMAPI-PC-v4.0.0-rc.1 --paths aurora-pc aurora-pc/aurora_pc_v40.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path 'dist/Aurora-SMAPI-PC-v4.0.0-rc.1.exe')) { throw 'Missing EXE' }
      - name: Publish Windows EXE and SHA-256
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = 'dist/Aurora-SMAPI-PC-v4.0.0-rc.1.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Aurora-SMAPI-PC-v4.0.0-rc.1.exe" | Set-Content -Path 'dist/SHA256SUMS-PC.txt'
          @'
          Aurora SMAPI PC v4.0.0 RC1, Windows 10/11 x64.
          Works with existing legally installed Stardew Valley + PC SMAPI.
          Run EXE, select game folder, choose profile, launch SMAPI.
          Create mod profiles and import one-mod ZIP archives (never overwrite).
          Coop v2.0 rooms: ephemeral 128-bit token; launch an Aurora2 invite
          with PC LAN or already-running private VPN address. Neither VPN
          setup nor game session is automatic. No public port forwarding.
          UDP 24644 discovery and TCP 24643 require private local/overlay IP.
          v2.6: validated ZIP restore to a new ISOLATED mod profile only;
          never replaces the Default Mods, any old profile or saves.
          v2.7: token-authenticated UDP diagnostics on PORT 24645 (Aurora).
          This is NOT Stardew Valley game UDP 24642 connectivity.
          v2.8: read-only comparisons of SMAPI profiles and dependencies.
          v2.9: Control Center 4.0 combined navigation.
          v4.0: one-click readiness report of installed Stardew/SMAPI,
          selected mod profile, declared versions and Aurora room status.
          This report never claims to check game UDP 24642 or real crossplay.
          v3.0 RC2: scrollable launcher on small Windows screens.
          Physical Android-to-PC device acceptance remains outstanding.
          v2.2: verified mod-profile backup ZIP to separate location; no restore.
          v2.3: native Control Center 3.0 theme/layout.
          v2.4: local Tailscale CLI status (no automatic VPN connect).
          v2.5: expanded searchable official Nexus Workshop links,
          plus read-only dependency
          check from the chosen PC mod profile. ZIP import remains manual.
          PC mod manifests and declared versions are sent only after
          receiving the current invite token over TCP 24643; on already
          connected VPN, the VPN must protect the transport.
          Android Aurora v1.8 checks active mod profile ID+versions.
          NOT proof that Stardew multiplayer works. Game uses UDP 24642.
          No tunnel, auto network setup, game APK, SMAPI binaries, ADB, admin,
          background service or file mirroring included.
          EXE is unsigned, may trigger Windows SmartScreen.
          'Default' profile uses Stardew Valley/Mods; custom profiles use
          --mods-path and store files in local user AppData.
          GPL-3.0 derivative; original project JunimoGate and SMAPI credited.
          '@ | Set-Content -Path 'dist/README-PC.txt'
          $tag = 'v4.0.0-pc-rc.1'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Existing immutable Windows preview release retained'
          } else {
            gh release create $tag $exe 'dist/SHA256SUMS-PC.txt' 'dist/README-PC.txt' --prerelease --title 'Aurora SMAPI PC v4.0.0 RC1.1 — Windows Launcher' --notes 'Aurora SMAPI PC v4.0.0 RC1 for Windows: combines v1.7 automatic discovery on trusted local Wi-Fi via UDP 24644 with TCP 24643 device status and v1.8 read-only cross-device compatibility data (selected PC mod IDs/versions and user-declared game/SMAPI version labels). Original game and SMAPI binaries are user-installed. Includes mod profiles, safe ZIP import, and regular/SMAPI launch. Not a Stardew session connection, VPN or UDP 24642 test. Unsigned EXE. No commercial game files.'
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-SMAPI-PC-v4.0.0-rc.1
          path: |
            dist/Aurora-SMAPI-PC-v4.0.0-rc.1.exe
            dist/SHA256SUMS-PC.txt
            dist/README-PC.txt
          if-no-files-found: error
          retention-days: 14
